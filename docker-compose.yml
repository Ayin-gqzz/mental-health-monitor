version: "3.9"

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mental_health
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data/数据集.csv:/app/data/数据集.csv:ro
    environment:
      - DATABASE_URL=mysql+pymysql://root:123456@mysql:3306/mental_health?charset=utf8mb4
      - JWT_SECRET=change-this-in-production
      - CSV_PATH=/app/data/数据集.csv
    depends_on:
      - mysql
    command: >
      sh -c "python ml/train.py &&
             python scripts/seed_db.py &&
             python scripts/simulate_behavior.py &&
             python scripts/assess_all.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
